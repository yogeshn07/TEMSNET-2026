# ============================================================
# Preprocessing Pipeline Configuration — UNSW-NB15
# IEEE TEMSMET 2026 | XAI-NIDS Imbalance Study
# ============================================================
# Frozen schema contract used by src/data/preprocessing_pipeline.py
# to validate incoming train/test CSVs before any transformation.
# Captured from the official UNSW_NB15_training-set.csv /
# UNSW_NB15_testing-set.csv files verified in Research Task B.1
# and profiled in Research Task B.2. Changing this file changes
# what counts as a valid dataset for the pipeline — do so only if
# the official dataset itself changes.
#
# target_column is intentionally NOT duplicated here — it is read
# from configs/dataset.yaml (single source of truth).
# ============================================================

